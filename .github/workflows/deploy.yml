name: deploy

# Push to `main` -> build on the NH self-hosted runner (LXC 505, label nh-marketing)
# and publish to the Cloudflare Pages project `ollasync-marketing`. Managed by NH Ops.
# wrangler is invoked via npx (NOT cloudflare/wrangler-action, which mis-selects bun on this runner).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nh-marketing]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci || npm install
          npm run build

      - name: CSP (hash every inline script, write dist/_headers)
        # public/_headers ships a __MKT_CSP__ placeholder; this writes the enforced policy from the BUILT pages and
        # fails the deploy on anything the policy would block. Without it the live site served the raw placeholder.
        run: node scripts/mkt_csp_headers.mjs dist
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4 pages deploy dist --project-name ollasync-marketing --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
